services:
  karriere:
    init: true
    build: .
    image: ghcr.io/toya62/karriere-pipeline:latest
    container_name: karriere-dashboard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/dashboard/app
      - /app/.venv
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
    restart: unless-stopped
