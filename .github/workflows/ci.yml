name: CI Tests

on:
  push:
    branches:
      - main
      - feat/vite-ts-frontend
    paths:
      - 'src/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - feat/vite-ts-frontend
    paths:
      - 'src/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karriere_user
          POSTGRES_PASSWORD: karriere_secure_pass_2026
          POSTGRES_DB: karriere_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx psycopg2-binary

      - name: Run Test Suite (SQLite)
        env:
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Run Test Suite (PostgreSQL)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://karriere_user:karriere_secure_pass_2026@localhost:5432/karriere_db
        run: |
          pytest -v tests/test_postgres_layer.py

  frontend:
    name: Frontend Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit Tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and Build
        working-directory: frontend
        run: npm run build
